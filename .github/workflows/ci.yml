name: ci

on:
  push:
    branches: ['1.0.x']
  pull_request:
    branches: ['1.0.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20: the lowest Node.js the base's engines field accepts (">=20").
        # 24: the Node.js the dashboard runs on, which loads this plugin.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The dashboard tests (tests/dashboard.test.ts) load this plugin into a real dashboard: webship/workspace.
      - name: a dashboard to load the plugin into
        uses: actions/checkout@v7
        with:
          repository: webship/workspace
          ref: 1.0.x
          path: .dashboard
          persist-credentials: false
      - name: install the dashboard
        working-directory: .dashboard/core/workspace-app
        run: npm ci --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          WORKSPACE_APP: ${{ github.workspace }}/.dashboard/core/workspace-app
      - name: every shell script parses
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          echo "$(git ls-files '*.sh' | wc -l) shell script(s) parse"

  # The plugin's webship-js features against a dashboard with this plugin installed (packed from this
  # checkout), started in the job: no DDEV, no account. The workflow lives in webship/workspace.
  browser:
    name: webship-js features
    uses: webship/workspace/.github/workflows/plugin-browser-suite.yml@1.0.x
